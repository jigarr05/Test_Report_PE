<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Phase Load Distribution</title>
<style>
:root{color-scheme:light;--bg:#fff;--tx:#333;--bd:#bdbdbd;--mut:#777;--in:#fff;--hl:#f0f0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;border:2px solid var(--bd)}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center;font-weight:400}
thead th{height:34px;font-size:15px}
tbody td{height:58px}
th.no,td.no{width:7%}
input{font:inherit;font-size:14px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:5px;padding:3px 6px;width:100%}
input.n{width:64px;text-align:center}
.name{font-size:13px;margin-bottom:3px;text-align:left}
.qty{display:flex;align-items:center;justify-content:center;gap:4px}
button{font:inherit;width:26px;height:26px;border:1px solid var(--bd);background:var(--hl);color:var(--tx);border-radius:5px;cursor:pointer;padding:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.box{background:var(--hl);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center}
.box b{display:block;font-size:1.4rem}.box span{font-size:.8rem;color:var(--mut)}
:root{--bd:#e3e5e9;--tx:#2f3237;--mut:#8a8f98;--hl:#f3f4f6}
body{background:linear-gradient(160deg,#f7f8fa,#e9ebef);min-height:100vh;font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;padding:28px 16px 40px}
h1{margin:0 0 4px;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;color:#2f3237}
.sub{margin:0 0 18px;color:var(--mut);font-size:.9rem}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(30,35,45,.08),0 1px 3px rgba(30,35,45,.06)}
table{border:none;border-collapse:separate;border-spacing:0}
th,td{border:none;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
th:last-child,td:last-child{border-right:none}
tbody tr:last-child td{border-bottom:none}
thead tr:nth-child(1) th{background:#2f3237;color:#fff;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;height:44px;border-color:#2f3237}
thead tr:nth-child(2) th{background:#fff;font-weight:600;font-size:14px;border-bottom:3px solid #c9ccd2}
thead tr:nth-child(2) th:nth-child(2){border-bottom-color:#e5484d;color:#c93a3f}
thead tr:nth-child(2) th:nth-child(3){border-bottom-color:#f5a524;color:#b97a0a}
thead tr:nth-child(2) th:nth-child(4){border-bottom-color:#3b82f6;color:#2563c9}
thead tr:nth-child(3) th{background:var(--hl);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);height:34px}
tbody td{background:#fff;font-weight:600;font-size:15px;transition:background .15s}
tbody tr:nth-child(even) td{background:#fafafb}
tbody tr:hover td{background:#f1f3f5}
tbody td:nth-child(3){border-left:2px solid #d5d8de}
tbody td:nth-child(1),tbody td:nth-child(2){text-align:left}
.name{font-weight:600;font-size:13.5px;color:#2f3237;margin-bottom:5px}
input{border:1px solid #dcdfe4;border-radius:9px;padding:5px 9px;background:#fff;transition:box-shadow .15s,border-color .15s}
input:focus{outline:none;border-color:#8a8f98;box-shadow:0 0 0 3px rgba(138,143,152,.2)}
input.n{width:68px;font-weight:600}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
button{width:28px;height:28px;border-radius:50%;border:1px solid #dcdfe4;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:16px;line-height:1;color:#2f3237;transition:all .15s}
button:hover{background:#2f3237;color:#fff;border-color:#2f3237}
.qty{justify-content:flex-start}
.sum{gap:14px;margin-top:20px}
.box{background:#fff;border:none;border-radius:16px;padding:14px 10px;box-shadow:0 6px 18px rgba(30,35,45,.07);border-top:4px solid #2f3237}
.box:nth-child(1){border-top-color:#e5484d}.box:nth-child(2){border-top-color:#f5a524}.box:nth-child(3){border-top-color:#3b82f6}
.box b{font-size:1.35rem;color:#2f3237;margin-bottom:2px}
.box span{text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;font-weight:600}
</style></head><body><div class="wrap">
<h1>Three Phase Load Distribution</h1><p class="sub">Enter quantity and wattage — loads are balanced across R, Y and B automatically.</p>
<div class="scroll card"><table>
<thead>
<tr><th colspan="8">Three Phase</th></tr>
<tr><th colspan="2"></th><th colspan="2">R Phase</th><th colspan="2">Y Phase</th><th colspan="2">B Phase</th></tr>
<tr><th style="width:22%">No.</th><th>Total Watt</th><th class="no">No.</th><th>Total Watt</th><th class="no">No.</th><th>Total Watt</th><th class="no">No.</th><th>Total Watt</th></tr>
</thead><tbody id="tb"></tbody></table></div>
<div class="sum" id="sum"></div>
</div>
<script>
const names=["Light","Fan","5A Plug","15A Plug","AC","Geyser"];
const rows=[];
for(let i=0;i<10;i++)rows.push({name:i<6?names[i]:"",custom:i>=6,qty:0,w:0});
function split(n){
  if(n<=0)return[0,0,0];
  if(n===1)return[0,0,1];
  if(n===2)return[0,1,1];
  const b=Math.floor(n/3),r=n%3;
  return[b+(r>0?1:0),b+(r>1?1:0),b];
}
const tb=document.getElementById('tb');
rows.forEach((r,i)=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`
  <td><div class="name">${r.custom?`<input type="text" placeholder="Extra equipment ${i-5}" data-k="name">`:r.name}</div>
  <div class="qty"><button data-k="dec" aria-label="decrease">−</button><input class="n" type="number" min="0" value="0" data-k="qty"><button data-k="inc" aria-label="increase">+</button></div></td>
  <td><input class="n" style="width:90px" type="number" min="0" value="0" placeholder="Watt" data-k="w"></td><td class="no"></td><td></td><td class="no"></td><td></td><td class="no"></td><td></td>`;
  tb.appendChild(tr);r.tr=tr;
  tr.addEventListener('click',e=>{
    const k=e.target.dataset.k;
    if(k==='inc'){r.qty++;tr.querySelector('[data-k=qty]').value=r.qty;render()}
    if(k==='dec'&&r.qty>0){r.qty--;tr.querySelector('[data-k=qty]').value=r.qty;render()}
  });
  tr.addEventListener('input',e=>{
    const k=e.target.dataset.k;
    if(k==='qty')r.qty=Math.max(0,parseInt(e.target.value)||0);
    if(k==='w')r.w=Math.max(0,parseFloat(e.target.value)||0);
    render();
  });
});
function render(){
  const Q=[0,0,0],W=[0,0,0];
  rows.forEach(r=>{
    const d=split(r.qty),c=r.tr.children;
    d.forEach((q,p)=>{
      Q[p]+=q;W[p]+=q*r.w;
      c[p*2+2].textContent=q||'';c[p*2+3].textContent=q?Math.round(q*r.w*100)/100:'';
    });
  });
  const f=n=>Math.round(n*100)/100,tq=Q[0]+Q[1]+Q[2],tw=W[0]+W[1]+W[2];
  document.getElementById('sum').innerHTML=
   ['R','Y','B'].map((p,i)=>`<div class="box"><b>${Q[i]} · ${f(W[i])} W</b><span>${p} Phase (qty · watt)</span></div>`).join('')+
   `<div class="box"><b>${tq}</b><span>Total Quantity</span></div><div class="box"><b>${f(tw)} W</b><span>Total Wattage</span></div>`;
}
render();
</script></body></html>
